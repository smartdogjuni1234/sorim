<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>우가우가 약속잡기</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Arial', sans-serif;
}

body{
  background:#ffdce8;
  overflow-x:hidden;
}

.hidden{
  display:none !important;
}

button{
  border:none;

/* 메인 화면 */
.main-screen{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
  background:
  linear-gradient(to bottom,#ffdce8,#ffeef4);
}

.title{
  font-size:42px;
  font-weight:900;
  color:#ff5f9e;
  text-align:center;
  margin-bottom:40px;
  line-height:1.3;
  text-shadow:3px 3px 0px white;
}

.name-buttons{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:30px;
}

.name-btn{
  width:100%;
  padding:16px;

  font-weight:bold;
  color:white;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.2s;
}

.name-btn:active{
  transform:scale(0.96);
}

.selected{
  outline:5px solid white;
}

.miseo{ background:#222; }
.solim{ background:#222; }
.esther{ background:#222; }
.hyeyeon{ background:#222; }
.hasle{ background:#222; }

.calendar-start-btn{
  width:100%;
  padding:18px;
  border-radius:22px;
  background:#ff70ad;
  color:white;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

/* 캘린더 화면 */
.calendar-screen{
  width:100%;
  min-height:100vh;
  padding:20px;
  background:#fff4f8;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  color:#ff5f9e;
  margin-bottom:10px;
}

.trip-input,
.date-input{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  margin-bottom:18px;
  background:white;
  font-size:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* 시간표 */
/* 색상 선택 */
.color-picker{
  display:flex;
  gap:12px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.color-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:4px solid white;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.color-btn.selected-color{
  outline:3px solid #ff5f9e;
}

.schedule-container{
  background:white;
  border-radius:24px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  margin-bottom:24px;
}

.time-row{
  display:flex;
  align-items:center;
  margin-bottom:4px;
}

.time-label{
  width:60px;
  font-size:12px;
  font-weight:bold;
  color:#666;
}

.time-slot{
  flex:1;
  height:22px;
  border-radius:8px;
  background:#f1f1f1;
  margin-left:6px;
  transition:0.15s;
}

/* 유저 버튼 */
.user-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:24px;
}

.user-tab{
  padding:12px 16px;
  border-radius:16px;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.checkmark{
  margin-right:6px;
}

/* 최종 버튼 */
.final-btn{
  width:100%;
  padding:18px;
  border-radius:24px;
  background:#8b5e3c;
  color:white;
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.bottom-space{
  height:30px;
}

</style>
</head>

<body>

<!-- 메인 화면 -->
<div class="main-screen" id="mainScreen">

  <div class="title">
    우가우가<br>
    약속잡기
  </div>

  <div class="name-buttons">

    <button class="name-btn miseo" data-name="미서">
      미서
    </button>

    <button class="name-btn solim" data-name="소림">
      소림
    </button>

    <button class="name-btn esther" data-name="에스더">
      에스더
    </button>

    <button class="name-btn hyeyeon" data-name="혜연">
      혜연
    </button>

    <button class="name-btn hasle" data-name="하슬">
      하슬
    </button>

  </div>

  <button class="calendar-start-btn" id="startBtn">
    캘린더 열기 💖
  </button>

</div>

<!-- 캘린더 화면 -->
<div class="calendar-screen hidden" id="calendarScreen">

  <div class="section-title">✈ 여행 제목</div>

  <input
    type="text"
    class="trip-input"
    placeholder="예: 제주도 여행"
  >

  <div class="section-title">📅 날짜</div>

  <input
    type="date"
    class="date-input"
  >

  <div class="section-title">🎨 캘린더 색상 선택</div>

  <div class="color-picker">

    <button class="color-btn" data-color="#7fd67f" style="background:#7fd67f"></button>
    <button class="color-btn" data-color="#ffd95f" style="background:#ffd95f"></button>
    <button class="color-btn" data-color="#ff8dc7" style="background:#ff8dc7"></button>
    <button class="color-btn" data-color="#7fdcff" style="background:#7fdcff"></button>
    <button class="color-btn" data-color="#c69bff" style="background:#c69bff"></button>
    <button class="color-btn" data-color="#ffb3c7" style="background:#ffb3c7"></button>

  </div>

  <!-- 시간표 -->
  <div class="schedule-container" id="scheduleContainer">
  </div>

  <!-- 유저 버튼 -->
  <div class="user-tabs">

    <button class="user-tab miseo" data-user="미서">
      미서
    </button>

    <button class="user-tab solim" data-user="소림">
      소림
    </button>

    <button class="user-tab esther" data-user="에스더">
      에스더
    </button>

    <button class="user-tab hyeyeon" data-user="혜연">
      혜연
    </button>

    <button class="user-tab hasle" data-user="하슬">
      하슬
    </button>

  </div>

  <button class="final-btn" id="finalBtn">
    최종 시간 보기 🤎
  </button>

  <div class="bottom-space"></div>

</div>

<script>

const mainScreen = document.getElementById('mainScreen');
const calendarScreen = document.getElementById('calendarScreen');
const startBtn = document.getElementById('startBtn');
const scheduleContainer = document.getElementById('scheduleContainer');
const finalBtn = document.getElementById('finalBtn');

const nameButtons = document.querySelectorAll('.name-btn');
const userTabs = document.querySelectorAll('.user-tab');

let selectedUser = '';
let viewingUser = '';
let finalMode = false;

const colorButtons = document.querySelectorAll('.color-btn');

const userColors = {
  '미서':'#ff8dc7',
  '소림':'#ff8dc7',
  '에스더':'#ff8dc7',
  '혜연':'#ff8dc7',
  '하슬':'#ff8dc7'
};

/* 색상 선택 */
colorButtons.forEach(btn=>{

  btn.addEventListener('click',()=>{

    colorButtons.forEach(b=>b.classList.remove('selected-color'));

    btn.classList.add('selected-color');

    userColors[selectedUser] = btn.dataset.color;

    renderSchedule();

  });

});

const schedules = {
  '미서': new Array(48).fill(false),
  '소림': new Array(48).fill(false),
  '에스더': new Array(48).fill(false),
  '혜연': new Array(48).fill(false),
  '하슬': new Array(48).fill(false)
};

/* 이름 선택 */
nameButtons.forEach(btn=>{

  btn.addEventListener('click',()=>{

    nameButtons.forEach(b=>b.classList.remove('selected'));

    btn.classList.add('selected');

    selectedUser = btn.dataset.name;

    viewingUser = selectedUser;

    document.querySelector('.selected-color')?.classList.remove('selected-color');

    colorButtons[2].classList.add('selected-color');

  });

});

/* 캘린더 시작 */
startBtn.addEventListener('click',()=>{

  if(selectedUser===''){
    alert('이름을 선택해주세요!');
    return;
  }

  mainScreen.classList.add('hidden');
  calendarScreen.classList.remove('hidden');

  renderSchedule();

});

/* 시간표 생성 */
function renderSchedule(){

  scheduleContainer.innerHTML='';

  for(let i=0;i<48;i++){

    const hour = Math.floor(i/2);
    const minute = i%2===0 ? '00' : '30';

    const row = document.createElement('div');
    row.className='time-row';

    const label = document.createElement('div');
    label.className='time-label';
    label.innerText=`${hour}:${minute}`;

    const slot = document.createElement('div');
    slot.className='time-slot';

    /* 최종모드 */
    if(finalMode){

      let count = 0;

      for(let user in schedules){
        if(schedules[user][i]) count++;
      }

      if(count>=2){
        slot.style.background
      }

    }else{

      if(viewingUser && schedules[viewingUser][i]){
        slot.style.background = userColors[viewingUser];
      }

    }

    /* 클릭 */
    slot.addEventListener('click',()=>{

      if(finalMode) return;

      schedules[selectedUser][i] = !schedules[selectedUser][i];

      renderSchedule();
      updateChecks();

    });

    row.appendChild(label);
    row.appendChild(slot);

    scheduleContainer.appendChild(row);

  }

}

/* 체크 표시 */
function updateChecks(){

  userTabs.forEach(tab=>{

    const user = tab.dataset.user;

    const hasChecked = schedules[user].includes(true);

    if(hasChecked){
      tab.innerHTML = `✔ ${user}`;
    }else{
      tab.innerHTML = user;
    }

  });

}

/* 유저별 보기 */
userTabs.forEach(tab=>{

  tab.addEventListener('click',()=>{

    finalMode = false;

    viewingUser = tab.dataset.user;

    renderSchedule();

  });

});

/* 최종 보기 */
finalBtn.addEventListener('click',()=>{

  finalMode = true;

  renderSchedule();

});

</script>

</body>
</html>
